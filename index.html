<style>
  /* ===== আপনার সম্পূর্ণ CSS – আমি কোনো পরিবর্তন করিনি ===== */
  /* (আপনার আগের CSS ঠিক একই থাকবে; আমি সংক্ষিপ্ততার জন্য এখানে রেখেছি, কিন্তু পুরো ফাইলে সব CSS থাকবে) */
  :root{
    --navy:#14213D; --paper:#EDE7D9; --paper-deep:#E4DCC8;
    --red:#A63D40; --gold:#C08A28; --green:#3F6659; --ink:#241F1A;
    --line: rgba(20,33,61,0.14); --card:#FBF9F3;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased;
    background-image:radial-gradient(circle at 18% 8%, rgba(20,33,61,0.04) 0, transparent 40%),radial-gradient(circle at 85% 92%, rgba(160,61,64,0.05) 0, transparent 45%);}
  @media (prefers-reduced-motion: reduce){*{animation-duration:0.01ms !important; transition-duration:0.01ms !important;}}
  a{color:inherit;} button{font-family:inherit;cursor:pointer;}
  .wrap{max-width:1080px;margin:0 auto;padding:0 28px;}
  h1,h2,h3{font-family:'Fraunces',serif;margin:0;color:var(--navy);}
  .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:12.5px;letter-spacing:0.12em;text-transform:uppercase;color:var(--red);font-weight:600;}
  .mono{font-family:'IBM Plex Mono',monospace;}

  .view{display:none;} .view.active{display:block;}

  header.top{padding:14px 0;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(237,231,217,0.92);backdrop-filter:blur(6px);z-index:50;}
  .top-inner{display:flex;align-items:center;justify-content:space-between;}
  .header-right{display:flex;align-items:center;}
  .brand{font-family:'IBM Plex Mono',monospace;font-weight:700;letter-spacing:-0.02em;color:var(--navy);font-size:17px;display:flex;align-items:center;gap:10px;cursor:pointer;}
  .brand-logo{width:38px;height:38px;border-radius:50%;object-fit:cover;flex-shrink:0;}
  .brand-text{display:inline-block;}
  .profile-btn{width:36px;height:36px;border-radius:50%;background:var(--card);border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--navy);overflow:hidden;flex-shrink:0;margin-left:14px;padding:0;position:relative;}
  .profile-btn img{width:100%;height:100%;object-fit:cover;}

  .profile-wrap{position:relative;}
  .profile-dropdown{display:none;position:absolute;top:calc(100% + 10px);right:0;width:280px;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 24px 50px -18px rgba(20,33,61,0.4);z-index:120;overflow:hidden;}
  .profile-dropdown.show{display:block;}
  .pd-head{padding:20px 18px 16px;display:flex;flex-direction:column;align-items:center;text-align:center;border-bottom:1px solid var(--line);background:var(--paper-deep);}
  .pd-avatar-wrap{position:relative;width:64px;height:64px;margin-bottom:10px;}
  .pd-avatar{width:64px;height:64px;border-radius:50%;object-fit:cover;border:2px solid var(--card);background:var(--navy);display:flex;align-items:center;justify-content:center;color:var(--paper);}
  .pd-avatar svg{width:30px;height:30px;}
  .pd-avatar-edit{position:absolute;bottom:-2px;right:-2px;width:24px;height:24px;border-radius:50%;background:var(--red);border:2px solid var(--card);display:flex;align-items:center;justify-content:center;color:#fff;padding:0;font-size:11px;}
  .pd-name{font-weight:700;font-size:14.5px;color:var(--navy);margin-top:2px;}
  .pd-firm{font-size:12px;color:rgba(36,31,26,0.6);margin-top:2px;}
  .pd-body{padding:14px 18px;}
  .pd-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px dashed var(--line);}
  .pd-row:last-of-type{border-bottom:none;}
  .pd-row-label{font-family:'IBM Plex Mono',monospace;font-size:10.5px;text-transform:uppercase;letter-spacing:0.06em;color:rgba(36,31,26,0.5);}
  .pd-row-value{font-size:13px;color:var(--navy);font-weight:600;display:flex;align-items:center;gap:8px;min-width:0;}
  .pd-email-text{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:150px;font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:500;}
  .pd-eye{background:none;border:none;padding:2px;flex-shrink:0;color:var(--navy);opacity:0.6;display:flex;align-items:center;}
  .pd-eye:hover{opacity:1;}
  .pd-eye svg{width:16px;height:16px;}
  .pd-plan-badge{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;background:rgba(63,102,89,0.14);color:var(--green);}
  .pd-plan-badge.trial{background:rgba(192,138,40,0.16);color:var(--gold);}
  .pd-footer{padding:12px 18px 16px;}
  .pd-logout-btn{width:100%;background:none;border:1.5px solid var(--red);color:var(--red);padding:9px;border-radius:6px;font-size:13px;font-weight:600;}
  .pd-logout-btn:hover{background:var(--red);color:#fff;}
  #pdAvatarFileInput{display:none;}

  .pwd-field-wrap{position:relative;}
  .pwd-field-wrap input[type=password],.pwd-field-wrap input[type=text].pwd-as-text{padding-right:40px;}
  .pwd-eye-btn{position:absolute;right:2px;top:50%;transform:translateY(-50%);background:none;border:none;padding:8px;color:var(--navy);opacity:0.55;display:flex;align-items:center;}
  .pwd-eye-btn:hover{opacity:1;}
  .pwd-eye-btn svg{width:18px;height:18px;}
  .top nav{display:flex;align-items:center;gap:24px;}
  .top nav a{font-size:14px;text-decoration:none;color:var(--navy);opacity:0.75;font-weight:500;}
  .top nav a:hover{opacity:1;}
  .navbtn{background:var(--navy);color:var(--paper);border:none;padding:9px 18px;border-radius:5px;font-size:13.5px;font-weight:600;}
  .navlink-ghost{background:none;border:none;font-size:13.5px;color:var(--navy);opacity:0.7;font-weight:500;}
  .customer-care-link{font-size:13.5px;color:var(--navy);opacity:0.75;text-decoration:none;font-weight:500;transition:opacity 0.15s ease;cursor:pointer;}
  .customer-care-link:hover{opacity:1;}
  @media (max-width:760px){ .customer-care-link{display:none;} }

  .hamburger{display:none;flex-direction:column;justify-content:center;gap:5px;background:none;border:none;width:38px;height:38px;flex-shrink:0;}
  .hamburger span{display:block;width:22px;height:2px;background:var(--navy);border-radius:2px;transition:transform 0.2s ease, opacity 0.2s ease;}
  .hamburger.open span:nth-child(1){transform:translateY(7px) rotate(45deg);}
  .hamburger.open span:nth-child(2){opacity:0;}
  .hamburger.open span:nth-child(3){transform:translateY(-7px) rotate(-45deg);}

  .mobile-menu{display:none;flex-direction:column;gap:2px;padding:10px 28px 18px;border-top:1px solid var(--line);}
  .mobile-menu.show{display:flex;}
  .mobile-menu a{padding:12px 4px;font-size:15px;text-decoration:none;color:var(--navy);border-bottom:1px solid var(--line);font-weight:500;}
  .mobile-menu .navlink-ghost{text-align:left;padding:12px 4px;font-size:15px;border-bottom:1px solid var(--line);}
  .mobile-menu .navbtn{text-align:center;padding:13px;font-size:14.5px;}
  @media (max-width:760px){ .top nav{display:none;} .hamburger{display:flex;} .brand-logo{width:46px;height:46px;} .brand-text{font-size:16px;} }

  section{padding:88px 0;} .section-head{max-width:640px;margin-bottom:48px;}
  .section-head h2{font-size:clamp(26px,3.4vw,36px);font-weight:600;margin-top:14px;line-height:1.15;}
  .section-head p{font-size:16px;color:rgba(36,31,26,0.72);margin-top:14px;}

  .hero{padding:70px 0 30px;}
  .hero h1{font-size:clamp(32px,4.6vw,50px);font-weight:600;line-height:1.1;letter-spacing:-0.01em;max-width:760px;margin-top:16px;}
  .hero h1 em{font-style:italic;color:var(--red);font-weight:500;}
  .hero p.sub{font-size:18px;max-width:600px;margin-top:20px;color:rgba(36,31,26,0.78);}
  .cta-row{display:flex;gap:14px;margin-top:30px;flex-wrap:wrap;}
  .btn{display:inline-flex;align-items:center;gap:8px;background:var(--red);color:#fff;padding:14px 26px;border-radius:5px;text-decoration:none;font-weight:600;font-size:14.5px;border:none;transition:transform 0.15s ease, background 0.15s ease;}
  .btn:hover{background:#8f3437;transform:translateY(-1px);}
  .btn-outline{background:transparent;color:var(--navy);border:1.5px solid var(--navy);}
  .btn-outline:hover{background:var(--navy);color:var(--paper);}
  .btn-gold{background:var(--gold);}
  .btn-gold:hover{background:#a5741f;}
  .btn-sm{padding:9px 16px;font-size:13px;}
  .stat-strip{margin-top:34px;padding:14px 18px;background:var(--card);border:1px solid var(--line);border-left:3px solid var(--red);border-radius:5px;font-size:13.5px;color:rgba(36,31,26,0.7);max-width:640px;}

  .ledger{margin-top:52px;background:var(--card);border:1px solid var(--line);border-radius:6px;box-shadow:0 24px 60px -30px rgba(20,33,61,0.35);overflow:hidden;position:relative;}
  .ledger::before{content:"";position:absolute;top:0;left:64px;bottom:0;width:1px;background:rgba(166,61,64,0.25);}
  .ledger-head{background:var(--navy);color:var(--paper);padding:16px 26px;display:flex;justify-content:space-between;align-items:baseline;font-family:'IBM Plex Mono',monospace;}
  .ledger-head .t1{font-size:13px;letter-spacing:0.08em;text-transform:uppercase;opacity:0.85;}
  .ledger-head .t2{font-size:12px;opacity:0.6;}
  .ledger-body{padding:30px 26px 26px 76px;}
  .controls{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-bottom:28px;}
  .control label{display:block;font-family:'IBM Plex Mono',monospace;font-size:12px;text-transform:uppercase;letter-spacing:0.06em;color:var(--navy);opacity:0.7;margin-bottom:10px;}
  .control .valline{font-family:'IBM Plex Mono',monospace;font-weight:600;color:var(--red);font-size:15px;margin-left:8px;}
  input[type=range]{width:100%;accent-color:var(--red);height:4px;}
  .rows{border-top:1px dashed var(--line);padding-top:22px;}
  .row{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px dashed var(--line);font-family:'IBM Plex Mono',monospace;}
  .row:last-child{border-bottom:none;}
  .row .label{font-size:14px;color:rgba(36,31,26,0.75);}
  .row .num{font-size:20px;font-weight:600;color:var(--navy);}
  .row.total{margin-top:6px;padding-top:18px;border-top:2px solid var(--navy);border-bottom:none;}
  .row.total .label{font-size:14px;font-weight:600;color:var(--navy);}
  .row.total .num{font-size:30px;color:var(--green);}
  .row.total .num small{font-size:14px;font-weight:500;color:rgba(36,31,26,0.6);}
  .stamp{position:absolute;top:26px;right:30px;border:2.5px solid var(--red);color:var(--red);border-radius:50%;width:96px;height:96px;display:flex;align-items:center;justify-content:center;text-align:center;font-family:'IBM Plex Mono',monospace;font-size:10.5px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;transform:rotate(-14deg);opacity:0;transition:opacity 0.4s ease, transform 0.4s ease;line-height:1.25;background:rgba(166,61,64,0.03);}
  .stamp.show{opacity:0.9;transform:rotate(-11deg) scale(1);}
  .ledger-note{font-size:12.5px;color:rgba(36,31,26,0.55);padding:14px 26px 20px 76px;border-top:1px solid var(--line);}
  @media (max-width:640px){.controls{grid-template-columns:1fr;} .ledger-body{padding:26px 18px 22px 34px;} .ledger::before{left:22px;} .ledger-note{padding:14px 18px 18px 34px;} .stamp{width:74px;height:74px;font-size:9px;top:16px;right:16px;}}

  .daylog{border-left:2px solid var(--line);margin-left:6px;}
  .daylog .item{position:relative;padding:0 0 34px 32px;}
  .daylog .item::before{content:"";position:absolute;left:-7px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--paper);border:2px solid var(--red);}
  .daylog .item:last-child{padding-bottom:0;}
  .daylog .time{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--red);font-weight:600;text-transform:uppercase;letter-spacing:0.05em;}
  .daylog .desc{font-size:16px;margin-top:6px;max-width:560px;color:var(--ink);}

  .fixgrid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden;}
  .fixcard{background:var(--card);padding:30px 28px;}
  .fixcard .pnum{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--gold);font-weight:700;letter-spacing:0.06em;}
  .fixcard h3{font-size:19px;margin-top:10px;font-weight:600;}
  .fixcard .problem{font-size:14px;color:rgba(36,31,26,0.65);margin-top:10px;padding-left:14px;border-left:2px solid var(--red);}
  .fixcard .solution{font-size:14px;color:var(--green);margin-top:12px;padding-left:14px;border-left:2px solid var(--green);font-weight:500;}

  function getReply(text, lang){
    const q = text.toLowerCase();
    const dict = replies[lang] || replies.en;
    if(/\b(hi|hello|hey|namaste|hola|হ্যালো|नमस्ते)\b/.test(q)) return dict.hi;
    if(/price|pricing|cost|₹|rupee|fee|দাম|कीमत/.test(q)) return dict.pricing;
    if(/trial|free|ট্রায়াল|फ्री/.test(q)) return dict.trial;
    if(/upload|file|format|csv|excel|xlsx|pdf|আপলোড|फाइल/.test(q)) return dict.upload;
    if(/secur|safe|encrypt|privacy|data|সুরক্ষा|सुरक्षा/.test(q)) return dict.security;
    if(/reconcil|mismatch|match|রিকনসিল|मिलान/.test(q)) return dict.reconcile;
    if(/report|download|export|রিপোর্ট|डाउनलोड/.test(q)) return dict.report;
    if(/demo|sample|try it|ডেমো|ट्राई/.test(q)) return dict.demo;
    if(/client|ক্লায়েন্ট|क्लाइंट/.test(q)) return dict.clients;
    if(/login|portal|password|credential|লগইন|पासवर्ड/.test(q)) return dict.login;
    if(/who (are|r) you|what are you|what is this|about|আপনি কে|यह क्या/.test(q)) return dict.about;
    if(/contact|support|help|email|reach|complain|complaint|customer care|human|যোগাযোগ|सहायता/.test(q)) return dict.contact;
    return dict.fallback;
  }

  function handleSend(){
    const val = input.value.trim();
    if(!val) return;
    addMsg(val, 'user');
    input.value = '';
    const lang = detectLanguage(val);
    setTimeout(() => {
      const answer = getReply(val, lang);
      addMsg(answer, 'bot');
    }, 300);
  }

  input.addEventListener('keydown', e => { if(e.key === 'Enter') handleSend(); });
  document.querySelectorAll('.ai-chip').forEach(chip => {

      input.value = chip.dataset.ask;

function isValidEmail(email){
  if(!email) return false;
  if(!email.includes('@')) return false;
  const parts = email.split('@');
  if(parts.length !== 2) return false;
  if(parts[0].length < 1) return false;
  if(!parts[1].includes('.')) return false;
  return true;
}

// ৩. প্রোফাইল ও সাবস্ক্রিপশন সিঙ্ক (ব্যাকএন্ড থেকে)
// =============================
async function syncUserData(){
  if(!state.user) return;
  try {
    const res = await fetch(`${API_BASE}/api/user-data?email=${encodeURIComponent(state.user.email)}`);
    const data = await res.json();
    if(data.user){
      state.user.name = data.user.name;
      state.user.firm = data.user.firm;
      state.user.region = data.user.region;
      state.subscriptionActive = data.user.subscriptionActive || false;
      state.clients = data.clients || [];
      if(data.user.profilePic){
        try { localStorage.setItem('eanova_avatar_v1_' + state.user.email, data.user.profilePic); } catch(e){}
      }
      persistCurrentAccount();
      updateNavState();
      renderDashboard();
    }
  } catch(e){ console.warn('Sync failed:', e); }
}

function renderCheckout(plan){
  const p = currentPlanPrice(plan);
  document.getElementById('payBtnAmount').textContent = p.currency + p.amount;
  document.getElementById('orderPlanLabel').textContent = 'EANOVA — ' + p.label + ' plan';
  document.getElementById('orderPlanAmount').textContent = p.currency + p.amount;
  document.getElementById('orderTotalAmount').textContent = p.currency + p.amount;
  document.getElementById('checkoutForm').style.display = 'block';
  document.getElementById('checkoutSuccess').style.display = 'none';
}

function currentPlanPrice(plan){
  const region = (state.user && state.user.region) || 'in';
  const rates = {
    'first': { in: { currency: '₹', amount: '99', period: '/mo', label: 'First Month' }, intl: { currency: '$', amount: '9', period: '/mo', label: 'First Month' } },
    'monthly': { in: { currency: '₹', amount: '199', period: '/mo', label: 'Monthly' }, intl: { currency: '$', amount: '25', period: '/mo', label: 'Monthly' } },
    'annual': { in: { currency: '₹', amount: '150', period: '/mo', label: 'Annual' }, intl: { currency: '$', amount: '19', period: '/mo', label: 'Annual' } }
  };
  const p = rates[plan] || rates.monthly;
  return p[region] || p.in;
}

// চেকআউট বাটনে ক্লিক – আপনার HTML-এ data-plan যোগ করতে হবে

});
